[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sec-searcher"
version = "0.1.0"
description = "Local source security review with FastAPI, Deep Agents, Graphify and llama.cpp"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "deepagents==0.7.13",
    "langchain-openai==1.6.0",
    "httpx==0.28.1",
    "graphifyy==0.9.55",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
sec-searcher = "sec_searcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_searcher"]
