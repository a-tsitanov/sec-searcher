name: sec-searcher
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    command: ["--llama-host", "host.docker.internal", "--agent-steps", "100", "--max-output-tokens", "8192", "--agent-seconds", "1800"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
